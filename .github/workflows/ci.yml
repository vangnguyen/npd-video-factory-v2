name: Video Factory V2 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-factory-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "apps/api[dev]" -e "services/worker[dev]"
      - run: python -m compileall -q apps/api/app services/worker/npd_worker
      - run: python -m pytest apps/api/tests services/worker/tests -q
      - name: Alembic upgrade, downgrade and replay
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-ci.db
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head

  renderer:
    name: Renderer tests and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run bundle:check

  studio:
    name: Studio tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check app.js
      - run: node --check trend-utils.mjs

  safety:
    name: Safety and compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Verify independent runtime boundary
        run: |
          test ! -d services/agent_hub
          ! grep -R -n -E 'services/agent_hub|from .*agent_hub|import .*agent_hub|AGENT_REDIS|AGENT_STORE' docker-compose.yml .env.example apps services renderer packages
      - name: Verify fail-closed defaults
        run: |
          grep -qx 'PUBLISH_ENABLED=false' .env.example
          grep -qx 'HUMAN_APPROVAL_REQUIRED=true' .env.example
          grep -qx 'TREND_FIXTURE_ENABLED=true' .env.example
          grep -qx 'AUTO_EDIT_FIXTURE_ENABLED=true' .env.example
          grep -qx 'VISION_FIXTURE_ENABLED=true' .env.example
          grep -qx 'VISION_PROVIDER=fixture' .env.example
      - name: Verify V2-owned durable services and VND-only ledger
        run: |
          grep -q '^  postgres:' docker-compose.yml
          grep -q '^  redis:' docker-compose.yml
          grep -q '^  minio:' docker-compose.yml
          grep -q '^  migrate:' docker-compose.yml
          grep -q '^  studio-web:' docker-compose.yml
          grep -Fq 'currency: Literal["VND"]' apps/api/app/platform_models.py
          grep -Fq "currency = 'VND'" apps/api/migrations/versions/0001_v2_02_create_durable_project_platform.py
      - name: Verify V2-03 research-only trend boundary
        run: |
          grep -Fq 'creator_media_downloaded": False' apps/api/app/trend_repository.py
          grep -Fq '"copied_creator_media": False' apps/api/app/trend_repository.py
          grep -Fq '"execution": False' apps/api/app/trend_service.py
          grep -Fq 'status = "not_configured"' apps/api/app/trend_providers.py
          ! git grep -I -n -E 'yt-dlp|youtube-dl|selenium|scrapy' -- apps services scripts
      - name: Verify V2-04 non-destructive Auto Edit boundary
        run: |
          grep -Fq 'source_media_mutated: Literal[False] = False' apps/api/app/auto_edit_models.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/auto_edit_models.py
          grep -Fq '"paid_external_call": False' apps/api/app/auto_edit_service.py
          grep -Fq 'original_evidence": True' apps/api/app/auto_edit_providers.py
          grep -q '0003_v2_04' apps/api/migrations/versions/0003_v2_04_auto_edit_analysis.py
          grep -q 'ffmpeg' apps/api/Dockerfile
      - name: Verify V2-05 structured Vision and non-destructive reframe boundary
        run: |
          grep -Fq 'source_media_mutated: Literal[False] = False' apps/api/app/vision_models.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/vision_models.py
          grep -Fq 'paid_external_call: Literal[False] = False' apps/api/app/vision_models.py
          grep -Fq 'class ContractOnlyVisionProvider' apps/api/app/vision_providers.py
          grep -Fq 'real_provider_tested": False' apps/api/app/vision_providers.py
          grep -Fq 'estimated_cost=Decimal("0")' apps/api/app/vision_service.py
          grep -Fq 'external or paid Vision execution is disabled in V2-05' apps/api/app/vision_service.py
          grep -q '0004_v2_05' apps/api/migrations/versions/0004_v2_05_vision_smart_reframe.py
          ! git grep -I -n -E 'VISION_(API_KEY|TOKEN|SECRET)=[^[:space:]]+' -- .
      - name: Secret pattern scan
        run: |
          if git grep -I -n -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'; then
            echo 'Potential secret material detected.' >&2
            exit 1
          fi
      - run: git diff --check

  docker-e2e:
    name: Docker deterministic E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/e2e-smoke.sh
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-05-vision-smart-reframe-e2e
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
