name: Video Factory V2 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-factory-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "apps/api[dev]" -e "services/worker[dev]" -e "services/comfyui-bridge[dev]"
      - run: python -m compileall -q apps/api/app services/worker/npd_worker services/comfyui-bridge/npd_comfyui_bridge
      - run: python -m pytest apps/api/tests services/worker/tests services/comfyui-bridge/tests -q
      - name: Validate V3-01 acceptance register and redacted evidence
        run: python scripts/v3_01_acceptance.py validate-repo
      - name: Evaluate V3-01-04 Flow A fixture boundary
        run: python scripts/v3_01_flow_a_acceptance.py evidence/v3-01/vf-v3-01-20260828T010641Z-88e6bcc/flows/flow-a-upload-auto-edit/two-run-contract.json --expect-verdict BLOCKED
      - name: Evaluate V3-01-05 Flow B fixture boundary
        run: python scripts/v3_01_flow_b_acceptance.py evidence/v3-01/vf-v3-01-20260828T033515Z-2563dfd/flows/flow-b-idea-ai-video/two-run-contract.json --expect-verdict BLOCKED
      - name: Evaluate V3-01-06 Flow C fixture boundary
        run: python scripts/v3_01_flow_c_acceptance.py evidence/v3-01/vf-v3-01-20260828T043714Z-c1f50c4/flows/flow-c-trend-publish-analytics/two-run-contract.json --expect-verdict BLOCKED
      - name: Evaluate V3-01-07 local DR and observability boundary
        run: python scripts/v3_01_dr_observability_acceptance.py evidence/v3-01/vf-v3-01-20260828T073400Z-527fd1f/operations/dr-observability/two-axis-contract.json --expect-verdict BLOCKED
      - name: Alembic upgrade, downgrade and replay
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-ci.db
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head

  renderer:
    name: Renderer tests and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run bundle:check

  studio:
    name: Studio tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check app.js
      - run: node --check auth.mjs
      - run: node --check trend-utils.mjs
      - run: node --check studio.js
      - run: node --check studio-utils.mjs

  safety:
    name: Safety and compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Verify independent runtime boundary
        run: |
          test ! -d services/agent_hub
          ! grep -R -n -E 'services/agent_hub|from .*agent_hub|import .*agent_hub|AGENT_REDIS|AGENT_STORE' docker-compose.yml .env.example apps services renderer packages
      - name: Verify fail-closed defaults
        run: |
          grep -qx 'PUBLISH_ENABLED=false' .env.example
          grep -qx 'PUBLISH_EXTERNAL_EXECUTION_ENABLED=false' .env.example
          grep -qx 'PUBLISH_OWNER_GATE_ENABLED=false' .env.example
          grep -qx 'HUMAN_APPROVAL_REQUIRED=true' .env.example
          grep -qx 'HUMAN_API_ENABLED=true' .env.example
          grep -qx 'HUMAN_WRITE_ENABLED=true' .env.example
          grep -qx 'TREND_FIXTURE_ENABLED=true' .env.example
          grep -qx 'AUTO_EDIT_FIXTURE_ENABLED=true' .env.example
          grep -qx 'VISION_FIXTURE_ENABLED=true' .env.example
          grep -qx 'VISION_PROVIDER=fixture' .env.example
          grep -qx 'MEDIA_FIXTURE_ENABLED=true' .env.example
          grep -qx 'MEDIA_EXTERNAL_EXECUTION_ENABLED=false' .env.example
          grep -qx 'MEDIA_PAID_EXECUTION_ENABLED=false' .env.example
          grep -qx 'PROVIDER_EXTERNAL_EXECUTION_ENABLED=false' .env.example
          grep -qx 'PROVIDER_PAID_EXECUTION_ENABLED=false' .env.example
          grep -qx 'PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=true' .env.example
          grep -qx 'PROVIDER_BUDGET_CURRENCY=VND' .env.example
          grep -qx 'PROVIDER_PER_OPERATION_LIMIT_VND=0' .env.example
          grep -qx 'PROVIDER_DAILY_LIMIT_VND=0' .env.example
          grep -qx 'PROVIDER_RETENTION_CLEANUP_ENABLED=false' .env.example
          grep -qx 'MEDIA_MALWARE_SCANNER_MODE=fixture' .env.example
          grep -qx 'COMFYUI_EXECUTION_ENABLED=false' .env.example
          grep -qx 'AUDIO_TTS_PROVIDER=espeak' .env.example
          grep -qx 'AUDIO_EXTERNAL_EXECUTION_ENABLED=false' .env.example
          grep -qx 'ANALYTICS_FIXTURE_ENABLED=true' .env.example
          grep -qx 'ANALYTICS_EXTERNAL_EXECUTION_ENABLED=false' .env.example
          grep -qx 'ANALYTICS_SCHEDULED_REFRESH_ENABLED=false' .env.example
      - name: Verify V2-owned durable services and VND-only ledger
        run: |
          grep -q '^  postgres:' docker-compose.yml
          grep -q '^  redis:' docker-compose.yml
          grep -q '^  minio:' docker-compose.yml
          grep -q '^  migrate:' docker-compose.yml
          grep -q '^  studio-web:' docker-compose.yml
          grep -Fq 'currency: Literal["VND"]' apps/api/app/platform_models.py
          grep -Fq "currency = 'VND'" apps/api/migrations/versions/0001_v2_02_create_durable_project_platform.py
      - name: Verify V2-03 research-only trend boundary
        run: |
          grep -Fq 'creator_media_downloaded": False' apps/api/app/trend_repository.py
          grep -Fq '"copied_creator_media": False' apps/api/app/trend_repository.py
          grep -Fq '"execution": False' apps/api/app/trend_service.py
          grep -Fq 'status = "not_configured"' apps/api/app/trend_providers.py
          ! git grep -I -n -E 'yt-dlp|youtube-dl|selenium|scrapy' -- apps services scripts
      - name: Verify V2-04 non-destructive Auto Edit boundary
        run: |
          grep -Fq 'source_media_mutated: Literal[False] = False' apps/api/app/auto_edit_models.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/auto_edit_models.py
          grep -Fq '"paid_external_call": False' apps/api/app/auto_edit_service.py
          grep -Fq 'original_evidence": True' apps/api/app/auto_edit_providers.py
          grep -q '0003_v2_04' apps/api/migrations/versions/0003_v2_04_auto_edit_analysis.py
          grep -q 'ffmpeg' apps/api/Dockerfile
      - name: Verify V2-05 structured Vision and non-destructive reframe boundary
        run: |
          grep -Fq 'source_media_mutated: Literal[False] = False' apps/api/app/vision_models.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/vision_models.py
          grep -Fq 'paid_external_call: Literal[False] = False' apps/api/app/vision_models.py
          grep -Fq 'class ContractOnlyVisionProvider' apps/api/app/vision_providers.py
          grep -Fq 'real_provider_tested": False' apps/api/app/vision_providers.py
          grep -Fq 'estimated_cost_vnd = Decimal("0")' apps/api/app/vision_providers.py
          grep -Fq 'estimated_cost=self.provider.estimated_cost_vnd or Decimal("0")' apps/api/app/vision_service.py
          grep -Fq 'self.provider_safety.execute(' apps/api/app/vision_service.py
          grep -q '0004_v2_05' apps/api/migrations/versions/0004_v2_05_vision_smart_reframe.py
          ! git grep -I -n -E 'VISION_(API_KEY|TOKEN|SECRET)=[^[:space:]]+' -- .
      - name: Verify V2-06 media rights, cost and execution boundary
        run: |
          grep -Fq 'source_media_mutated: Literal[False] = False' apps/api/app/media_intelligence_models.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/media_intelligence_models.py
          grep -Fq 'paid_external_call: Literal[False] = False' apps/api/app/media_intelligence_models.py
          grep -Fq 'owner_override_recorded: Literal[False] = False' apps/api/app/media_intelligence_models.py
          grep -Fq 'social_media_downloaded": False' apps/api/app/media_intelligence_providers.py
          grep -Fq 'production_eligible=False' apps/api/app/media_intelligence_providers.py
          grep -Fq 'external media execution is disabled in V2-06' apps/api/app/media_intelligence_service.py
          grep -Fq 'paid media execution is disabled in V2-06' apps/api/app/media_intelligence_service.py
          grep -q '0005_v2_06' apps/api/migrations/versions/0005_v2_06_media_intelligence.py
          grep -q 'profiles: \["gpu"\]' docker-compose.yml
          grep -q 'approved allowlist' services/comfyui-bridge/npd_comfyui_bridge/workflows.py
          python -c 'import json; from pathlib import Path; manifest=json.loads(Path("workflows/comfyui/manifest.json").read_text()); assert len(manifest["workflows"]) == 8; source=Path("services/comfyui-bridge/npd_comfyui_bridge/models.py").read_text(); assert "graph:" not in source'
          ! git grep -I -n -E 'COMFYUI_(API_KEY|TOKEN|SECRET)=[^[:space:]]+' -- apps services workflows .env.example
      - name: Verify V2-07 timeline and proxy-preview boundary
        run: |
          grep -Fq 'source_media_mutated: Literal[False] = False' apps/api/app/timeline_models.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/timeline_models.py
          grep -Fq 'external_call: Literal[False] = False' apps/api/app/timeline_models.py
          grep -Fq 'PREVIEW_QUEUE_KEY = "npd:video-factory:v2:preview:queued"' apps/api/app/timeline_service.py
          grep -Fq '"publishing_allowed": False' apps/api/app/timeline_service.py
          grep -Fq '"audio_mixing": "deferred_to_v2_08"' apps/api/app/timeline_service.py
          grep -q '0006_v2_07' apps/api/migrations/versions/0006_v2_07_auto_edit_studio.py
          python -c 'import json; from pathlib import Path; schema=json.loads(Path("packages/contracts/timeline.schema.json").read_text()); assert schema["$schema"].endswith("2020-12/schema"); assert schema["additionalProperties"] is False'
          ! git grep -I -n -E '^(PUBLISH_ENABLED=true|HUMAN_APPROVAL_REQUIRED=false)$' -- .env.example apps services packages
      - name: Verify V2-08 audio, subtitle, approval and render-QC boundary
        run: |
          grep -Fq 'publishing_allowed: Literal[False] = False' apps/api/app/production_models.py
          grep -Fq 'external_publish_requested: Literal[False] = False' apps/api/app/production_models.py
          grep -Fq 'PRODUCTION_RENDER_QUEUE_KEY = "npd:video-factory:v2:production-render:queued"' apps/api/app/production_service.py
          grep -Fq 'final render requires the current approved review package' apps/api/app/production_repository.py
          grep -q '0007_v2_08' apps/api/migrations/versions/0007_v2_08_audio_subtitle_render_qc.py
          python -c 'import json; from pathlib import Path; schema=json.loads(Path("packages/contracts/timeline-render.schema.json").read_text()); assert schema["$schema"].endswith("2020-12/schema"); assert schema["additionalProperties"] is False; assert schema["properties"]["safety"]["properties"]["publishing_allowed"]["const"] is False'
          ! git grep -I -n -E '^(AUDIO_EXTERNAL_EXECUTION_ENABLED=true|PUBLISH_ENABLED=true|HUMAN_APPROVAL_REQUIRED=false)$' -- .env.example apps services packages
      - name: Verify V2-09 publishing dry-run and external-action boundary
        run: |
          grep -Fq 'class PublishingProvider(Protocol)' apps/api/app/publishing_providers.py
          grep -Fq 'duplicate_post_created: Literal[False] = False' apps/api/app/publishing_models.py
          grep -Fq 'external_action=False' apps/api/app/publishing_providers.py
          grep -Fq 'OFFICIAL_ADAPTER_CONTRACT_ONLY' apps/api/app/publishing_providers.py
          grep -q '0008_v2_09' apps/api/migrations/versions/0008_v2_09_publishing.py
          python -c 'import json; from pathlib import Path; data=json.loads(Path("packages/contracts/publishing-capabilities.json").read_text()); assert set(data["platforms"]) == {"youtube", "tiktok", "instagram_reels", "facebook"}; assert all(item["verification_state"] == "internal_safe_profile" for item in data["platforms"].values())'
          ! git grep -I -n -E '^(PUBLISH_EXTERNAL_EXECUTION_ENABLED=true|PUBLISH_OWNER_GATE_ENABLED=true|YOUTUBE_PUBLISHING_CREDENTIAL_REF=.+|TIKTOK_PUBLISHING_CREDENTIAL_REF=.+|INSTAGRAM_PUBLISHING_CREDENTIAL_REF=.+|FACEBOOK_PUBLISHING_CREDENTIAL_REF=.+)$' -- .env.example apps services packages
      - name: Verify V2-10 analytics, nullable metrics and recommendation-only boundary
        run: |
          grep -Fq 'class AnalyticsProvider(Protocol)' apps/api/app/analytics_providers.py
          grep -Fq 'external_call: Literal[False] = False' apps/api/app/analytics_models.py
          grep -Fq 'automatic_action: Literal[False] = False' apps/api/app/analytics_models.py
          grep -Fq 'autonomous_execution: Literal[False] = False' apps/api/app/analytics_models.py
          grep -Fq 'idea_rank_mutated": False' apps/api/app/analytics_service.py
          grep -Fq 'ANALYTICS_SYNC_QUEUE_KEY = "npd:video-factory:v2:analytics:queued"' apps/api/app/analytics_service.py
          grep -q '0009_v2_10' apps/api/migrations/versions/0009_v2_10_analytics_learning.py
          grep -Fq 'CheckConstraint("external_call = false"' apps/api/app/analytics_db.py
          ! git grep -I -n -E '^(ANALYTICS_EXTERNAL_EXECUTION_ENABLED=true|ANALYTICS_SCHEDULED_REFRESH_ENABLED=true|YOUTUBE_ANALYTICS_CREDENTIAL_REF=.+|TIKTOK_ANALYTICS_CREDENTIAL_REF=.+|INSTAGRAM_ANALYTICS_CREDENTIAL_REF=.+|FACEBOOK_ANALYTICS_CREDENTIAL_REF=.+)$' -- .env.example apps services packages
      - name: Verify V2-11 Agent Hub bridge and production hardening boundary
        run: |
          grep -Fq 'WEBHOOK_QUEUE_KEY = "npd:video-factory:v2:bridge:webhooks:queued"' apps/api/app/bridge_service.py
          grep -Fq 'execution_started: Literal[False] = False' apps/api/app/bridge_models.py
          grep -Fq 'external_action_requested: Literal[False] = False' apps/api/app/bridge_models.py
          grep -Fq 'CheckConstraint("execution_started = false"' apps/api/app/bridge_db.py
          grep -Fq 'hmac.compare_digest' apps/api/app/bridge_auth.py
          grep -q '0010_v2_11' apps/api/migrations/versions/0010_v2_11_agent_hub_bridge.py
          python -c 'import json; from pathlib import Path; schema=json.loads(Path("packages/contracts/agent-hub-bridge.v1.schema.json").read_text()); assert schema["properties"]["contract_version"]["const"] == "agent-hub-bridge.v1"; assert schema["additionalProperties"] is False'
          grep -qx 'AGENT_HUB_BRIDGE_ENABLED=false' .env.example
          grep -qx 'AGENT_HUB_WEBHOOK_MODE=disabled' .env.example
          grep -qx 'AGENT_HUB_WEBHOOK_EXTERNAL_DELIVERY_ENABLED=false' .env.example
          ! git grep -I -n -E '^(AGENT_HUB_BRIDGE_ENABLED=true|AGENT_HUB_WEBHOOK_MODE=http|AGENT_HUB_WEBHOOK_EXTERNAL_DELIVERY_ENABLED=true)$' -- .env.example
          ! git grep -I -n -E 'services/agent_hub|from .*agent_hub|import .*agent_hub|AGENT_REDIS|AGENT_STORE' -- apps services docker-compose.yml deploy
      - name: Verify V3-01-01 human identity and ingress boundary
        run: |
          grep -Fq 'hmac.compare_digest' apps/api/app/human_auth.py
          grep -Fq 'workspace_isolation": "deny_by_default"' apps/api/app/main.py
          grep -Fq 'HUMAN_WRITE_ENABLED: "false"' deploy/production/docker-compose.production.yml
          grep -Fq 'HUMAN_API_ENABLED: "true"' deploy/production/docker-compose.production.yml
          python -c 'import json; from pathlib import Path; data=json.loads(Path("deploy/testing/disabled-human-auth.json").read_text()); assert data == {"version": 1, "tokens": {}}'
          python -c 'import json; from pathlib import Path; schema=json.loads(Path("packages/contracts/human-auth-registry.schema.json").read_text()); assert schema["additionalProperties"] is False; assert schema["properties"]["tokens"]["additionalProperties"]["properties"]["token_sha256"]["pattern"] == "^[a-f0-9]{64}$"'
          ! git grep -I -n -E 'vf1\.[A-Za-z0-9._-]+\.[A-Za-z0-9_-]{32,}' -- ':!scripts/e2e-smoke.sh' ':!apps/api/tests' ':!apps/studio-web/tests'
      - name: Verify V3-01-02 provider safety boundary
        run: |
          grep -Fq 'class ProviderSafetyController' apps/api/app/provider_safety.py
          grep -Fq 'currency: Literal["VND"]' apps/api/app/provider_safety.py
          grep -Fq 'warning_threshold_percent' apps/api/app/provider_safety.py
          grep -Fq 'GLOBAL_KILL_SWITCH_ENGAGED' apps/api/app/provider_safety.py
          grep -Fq 'ARTIFACT_STORAGE_MISMATCH' apps/api/app/provider_safety.py
          grep -Fq 'provider_safety=app.state.provider_safety_controller' apps/api/app/main.py
          ! git grep -I -n -E '^(PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|PROVIDER_BUDGET_CURRENCY=USD)$' -- .env.example apps services packages deploy
      - name: Verify V3-01-03 ingress media and durable safety boundary
        run: |
          grep -Fq 'class DurableProviderSafetyController' apps/api/app/provider_safety_durable.py
          grep -Fq 'class ProviderSafetyOperationORM' apps/api/app/provider_safety_db.py
          grep -Fq 'ProviderSafetyControlORM.revision + 1' apps/api/app/provider_safety_repository.py
          grep -Fq 'state_backend="postgresql"' apps/api/app/provider_safety_durable.py
          grep -Fq 'class ClamdMediaMalwareScanner' apps/api/app/media_security.py
          grep -Fq 'reject_archive_container(assembled)' apps/api/app/auto_edit_service.py
          grep -Fq 'upload cannot be promoted before a clean malware verdict' apps/api/app/auto_edit_repository.py
          grep -q '0011_v3_01_03' apps/api/migrations/versions/0011_v3_01_03_security_durable_safety.py
          grep -Fq 'MEDIA_MALWARE_SCANNER_MODE: disabled' deploy/production/docker-compose.production.yml
          grep -Fq 'PROVIDER_RETENTION_CLEANUP_ENABLED: "false"' deploy/production/docker-compose.production.yml
          python -c 'import json; from pathlib import Path; data=json.loads(Path("packages/contracts/ingress-media-security.v1.json").read_text()); assert data["contract_version"] == "ingress-media-security.v1"; assert data["authorization"]["public_ingress_approved"] is False; assert data["media_pipeline"]["archive_ingestion_enabled"] is False; assert data["media_pipeline"]["clean_verdict_required_for_trusted_storage"] is True'
          ! grep -Eq '^  (clamd|caddy|nginx|traefik):' docker-compose.yml deploy/production/docker-compose.production.yml
          ! git grep -I -n -E '^(MEDIA_MALWARE_SCANNER_MODE=fixture|PROVIDER_RETENTION_CLEANUP_ENABLED=true|PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false)$' -- deploy/production
      - name: Verify V3-01-04 Flow A acceptance boundary
        run: |
          grep -Fq 'class FlowAAcceptanceBundle' apps/api/app/flow_a_acceptance.py
          grep -Fq 'self.provider_safety.execute(' apps/api/app/auto_edit_service.py
          grep -Fq 'self.provider_safety.execute(' apps/api/app/vision_service.py
          grep -Fq 'fixture evidence cannot be promoted to real-provider evidence' apps/api/app/flow_a_acceptance.py
          ! git grep -I -n -E '^(PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|AUDIO_EXTERNAL_EXECUTION_ENABLED=true)$' -- .env.example deploy/production
      - name: Verify V3-01-05 Flow B acceptance boundary
        run: |
          grep -Fq 'class FlowBAcceptanceBundle' apps/api/app/flow_b_acceptance.py
          grep -Fq 'fixture evidence cannot be promoted to real-provider evidence' apps/api/app/flow_b_acceptance.py
          grep -Fq 'fixture source cannot be promoted to real-source evidence' apps/api/app/flow_b_acceptance.py
          grep -Fq 'currency: Literal["VND"]' apps/api/app/flow_b_acceptance.py
          grep -Fq 'external_action_performed: Literal[False] = False' apps/api/app/flow_b_acceptance.py
          grep -Fq 'publish_requested: Literal[False] = False' apps/api/app/flow_b_acceptance.py
          ! git grep -I -n -E '^(PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|PROVIDER_BUDGET_CURRENCY=USD|AUDIO_EXTERNAL_EXECUTION_ENABLED=true|PUBLISH_ENABLED=true)$' -- .env.example deploy/production
      - name: Verify V3-01-06 Flow C acceptance boundary
        run: |
          grep -Fq 'class FlowCAcceptanceBundle' apps/api/app/flow_c_acceptance.py
          grep -Fq 'fixture provider cannot be promoted to real-provider evidence' apps/api/app/flow_c_acceptance.py
          grep -Fq 'fixture trend source cannot be promoted to real-source evidence' apps/api/app/flow_c_acceptance.py
          grep -Fq 'fixture analytics snapshot cannot be promoted to real evidence' apps/api/app/flow_c_acceptance.py
          grep -Fq 'fixture publication cannot be promoted to real publication evidence' apps/api/app/flow_c_acceptance.py
          grep -Fq 'currency: Literal["VND"]' apps/api/app/flow_c_acceptance.py
          grep -Fq 'external_action_allowed_during_contract_test: Literal[False] = False' apps/api/app/flow_c_acceptance.py
          grep -Fq 'real_publish_allowed_during_contract_test: Literal[False] = False' apps/api/app/flow_c_acceptance.py
          ! git grep -I -n -E '^(PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|PROVIDER_BUDGET_CURRENCY=USD|PUBLISH_ENABLED=true|PUBLISH_EXTERNAL_EXECUTION_ENABLED=true|ANALYTICS_EXTERNAL_EXECUTION_ENABLED=true)$' -- .env.example deploy/production
      - name: Verify V3-01-07 DR and observability boundary
        run: |
          grep -Fq 'class OperationsObservabilityService' apps/api/app/operations_observability.py
          grep -Fq 'prefix="/api/v1/operations"' apps/api/app/operations_routes.py
          grep -Fq 'external_notifications_allowed: Literal[False] = False' apps/api/app/dr_observability_acceptance.py
          grep -Fq 'production_restore_allowed: Literal[False] = False' apps/api/app/dr_observability_acceptance.py
          grep -Fq 'VIDEO_FACTORY_DRILL_MODE=disposable-ci' scripts/e2e-smoke.sh
          grep -Fq 'Refusing non-disposable compose project' scripts/v3-01-dr-observability-drill.sh
          grep -qx 'OPERATIONS_EXTERNAL_NOTIFICATIONS_ENABLED=false' .env.example
          grep -Fq 'OPERATIONS_EXTERNAL_NOTIFICATIONS_ENABLED: "false"' deploy/production/docker-compose.production.yml
          ! git grep -I -n -E '^(OPERATIONS_EXTERNAL_NOTIFICATIONS_ENABLED=true|PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|PROVIDER_BUDGET_CURRENCY=USD)$' -- .env.example deploy/production
      - name: Verify V3-01-09 OpenAI Vision adapter boundary
        run: |
          grep -Fq 'class OpenAIVisionProvider' apps/api/app/openai_vision_provider.py
          grep -Fq '"store": False' apps/api/app/openai_vision_provider.py
          grep -Fq '"type": "json_schema"' apps/api/app/openai_vision_provider.py
          grep -Fq 'actual_cost=lambda result: result.actual_cost_vnd' apps/api/app/vision_service.py
          grep -Fq 'if self.openai_vision_model != "gpt-5-mini"' apps/api/app/config.py
          grep -qx 'VISION_PROVIDER=fixture' .env.example
          grep -qx 'OPENAI_VISION_MODEL=gpt-5-mini' .env.example
          grep -qx 'OPENAI_VISION_ESTIMATED_COST_VND=0' .env.example
          grep -qx 'OPENAI_VISION_INPUT_VND_PER_MILLION_TOKENS=0' .env.example
          grep -qx 'OPENAI_VISION_CACHED_INPUT_VND_PER_MILLION_TOKENS=0' .env.example
          grep -qx 'OPENAI_VISION_OUTPUT_VND_PER_MILLION_TOKENS=0' .env.example
          test "$(grep -Fc 'OPENAI_API_KEY: ""' docker-compose.yml)" -eq 4
          ! git grep -I -n -E '^(VISION_PROVIDER=openai|OPENAI_API_KEY=.+|PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|OPENAI_VISION_ESTIMATED_COST_VND=[1-9][0-9]*)$' -- .env.example docker-compose.yml deploy apps services
      - name: Verify V3-01-10 bounded provider gate-loader boundary
        run: |
          grep -Fq 'class ProviderGateBundle' apps/api/app/provider_gate_loader.py
          grep -Fq 'hmac.compare_digest' apps/api/app/provider_gate_loader.py
          grep -Fq 'v3-01-g03a-openai-vision-call-01' apps/api/app/provider_gate_loader.py
          grep -Fq 'v3-01-g03a-openai-vision-call-02' apps/api/app/provider_gate_loader.py
          grep -Fq 'every owner approval must bind the exact execution scope hash' apps/api/app/provider_gate_loader.py
          grep -Fq 'self.provider_safety.execute(' apps/api/app/vision_service.py
          grep -qx 'PROVIDER_VERIFIED_GATE_BUNDLE_ENABLED=false' .env.example
          grep -qx 'PROVIDER_VERIFIED_GATE_BUNDLE_SHA256=' .env.example
          grep -qx 'PROVIDER_GATE_EXPECTED_RC_COMMIT=' .env.example
          grep -qx 'PROVIDER_GATE_EXPECTED_RC_TAG=' .env.example
          grep -qx 'PROVIDER_EXTERNAL_EXECUTION_ENABLED=false' .env.example
          grep -qx 'PROVIDER_PAID_EXECUTION_ENABLED=false' .env.example
          grep -qx 'PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=true' .env.example
          grep -qx 'PROVIDER_PER_OPERATION_LIMIT_VND=0' .env.example
          grep -qx 'PROVIDER_DAILY_LIMIT_VND=0' .env.example
          python -c 'import hashlib,json; from pathlib import Path; record=json.loads(Path("docs/acceptance/v3-01/rights/V3-01-RIGHTS-G03A-001.json").read_text()); assert record["decision"] == "APPROVED"; assert record["reviewer"] == "Owner (GitHub: vangnguyen)"; assert record["social_platform_use"] == []; assert record["license_name"] == "NPD owner-approved Vision acceptance only; no publishing, training, resale or other use"; assert record["secret_recorded"] is False; assert hashlib.sha256(Path("docs/acceptance/v3-01/assets/g03-a-owned-vision-test.png").read_bytes()).hexdigest() == record["asset_hash"]'
          ! git grep -I -n -E '^(PROVIDER_VERIFIED_GATE_BUNDLE_ENABLED=true|PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|PROVIDER_PER_OPERATION_LIMIT_VND=[1-9][0-9]*|PROVIDER_DAILY_LIMIT_VND=[1-9][0-9]*)$' -- .env.example deploy apps services
      - name: Verify V3-01-11 Structured Outputs and error-evidence boundary
        run: |
          grep -Fq 'track_hint: str | None = Field(max_length=120)' apps/api/app/openai_vision_provider.py
          grep -Fq 'validate_strict_structured_output_schema(response_schema)' apps/api/app/openai_vision_provider.py
          grep -Fq 'class ProviderErrorEvidence' apps/api/app/provider_safety.py
          grep -Fq 'error_evidence: Mapped[dict[str, object] | None]' apps/api/app/provider_safety_db.py
          grep -q '0012_v3_01_11' apps/api/migrations/versions/0012_v3_01_11_provider_error_evidence.py
          ! git grep -I -n -E '^(VISION_PROVIDER=openai|OPENAI_API_KEY=.+|PROVIDER_EXTERNAL_EXECUTION_ENABLED=true|PROVIDER_PAID_EXECUTION_ENABLED=true|PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED=false|PROVIDER_PER_OPERATION_LIMIT_VND=[1-9][0-9]*|PROVIDER_DAILY_LIMIT_VND=[1-9][0-9]*)$' -- .env.example docker-compose.yml deploy apps services
      - name: Validate V2-11 deployment bundle
        env:
          VIDEO_FACTORY_AGENT_HUB_KEYS_FILE: ${{ runner.temp }}/video-factory-agent-hub.json
        run: |
          install -m 0600 deploy/testing/disabled-agent-hub.json "$VIDEO_FACTORY_AGENT_HUB_KEYS_FILE"
          docker compose -f docker-compose.yml -f deploy/production/docker-compose.production.yml config --quiet
          bash -n scripts/v2-11-preflight.sh scripts/v2-11-backup.sh scripts/v2-11-restore.sh scripts/v2-11-deploy.sh scripts/v2-11-smoke.sh scripts/v2-11-soak.sh scripts/v3-01-dr-observability-drill.sh
          services="$(docker compose -f docker-compose.yml -f deploy/production/docker-compose.production.yml config --services)"
          ! grep -Eq '^(agent-hub|agent_hub|caddy|n8n)$' <<<"$services"
      - name: Secret pattern scan
        run: |
          if git grep -I -n -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'; then
            echo 'Potential secret material detected.' >&2
            exit 1
          fi
      - run: git diff --check

  docker-e2e:
    name: Docker deterministic E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/e2e-smoke.sh
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-11-agent-hub-bridge-e2e
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
