[project]
name = "npd-provider-broker"
version = "0.1.0"
description = "Standalone VPS OpenAI compatibility broker; Content execution disabled"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "openai==2.8.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools]
packages = ["npd_provider_broker"]
package-dir = {npd_provider_broker = "app"}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
