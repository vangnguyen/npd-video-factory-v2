[project]
name = "npd-comfyui-bridge"
version = "0.1.0"
description = "Allowlisted ComfyUI execution bridge for NPD Video Factory V2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["npd_comfyui_bridge*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
