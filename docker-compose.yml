name: npd-video-factory-v2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VIDEO_POSTGRES_USER:-video_factory}
      POSTGRES_PASSWORD: ${VIDEO_POSTGRES_PASSWORD:-development-only}
      POSTGRES_DB: ${VIDEO_POSTGRES_DB:-video_factory}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDEO_POSTGRES_USER:-video_factory} -d ${VIDEO_POSTGRES_DB:-video_factory}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-video-factory-dev}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-video-factory-dev-only-change-me}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${VIDEO_POSTGRES_USER:-video_factory}:${VIDEO_POSTGRES_PASSWORD:-development-only}@postgres:5432/${VIDEO_POSTGRES_DB:-video_factory}
      # V3-01-09 never propagates a workstation credential into local/CI containers.
      OPENAI_API_KEY: ""
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${VIDEO_POSTGRES_USER:-video_factory}:${VIDEO_POSTGRES_PASSWORD:-development-only}@postgres:5432/${VIDEO_POSTGRES_DB:-video_factory}
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:3001
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-video-factory-dev}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-video-factory-dev-only-change-me}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      PROVIDER_EXTERNAL_EXECUTION_ENABLED: "false"
      PROVIDER_PAID_EXECUTION_ENABLED: "false"
      PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED: "true"
      PROVIDER_BUDGET_CURRENCY: VND
      PROVIDER_PER_OPERATION_LIMIT_VND: "0"
      PROVIDER_DAILY_LIMIT_VND: "0"
      OPENAI_API_KEY: ""
      PROVIDER_HTTP_TIMEOUT_SECONDS: "90"
      CONTROLLER_HARD_TIMEOUT_SECONDS: "120"
      PROVIDER_MAX_CONCURRENT_CALLS: "2"
      PROVIDER_OPERATION_LEASE_SECONDS: "900"
      PROVIDER_OPERATION_RETENTION_DAYS: "400"
      PROVIDER_RETENTION_CLEANUP_ENABLED: "false"
      OPERATIONS_QUEUE_BACKLOG_WARNING: "50"
      OPERATIONS_FAILED_JOBS_WARNING: "1"
      OPERATIONS_DISK_WARNING_PERCENT: "85"
      OPERATIONS_DISK_CRITICAL_PERCENT: "95"
      OPERATIONS_EVIDENCE_RETENTION_DAYS: "400"
      OPERATIONS_LOG_RETENTION_DAYS: "30"
      OPERATIONS_EXTERNAL_NOTIFICATIONS_ENABLED: "false"
      MEDIA_MALWARE_SCANNER_MODE: fixture
    ports:
      - "${VIDEO_API_BIND:-127.0.0.1}:${VIDEO_API_PORT:-8000}:8000"
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
      - ${VIDEO_FACTORY_HUMAN_AUTH_FILE:-./deploy/testing/disabled-human-auth.json}:/run/secrets/video-factory-human-auth.json:ro
      - ${VIDEO_FACTORY_AGENT_HUB_KEYS_FILE:-./deploy/testing/disabled-agent-hub.json}:/run/secrets/video-factory-agent-hub.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  studio-web:
    build:
      context: ./apps/studio-web
    restart: unless-stopped
    ports:
      - "${VIDEO_STUDIO_BIND:-127.0.0.1}:${VIDEO_STUDIO_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${VIDEO_POSTGRES_USER:-video_factory}:${VIDEO_POSTGRES_PASSWORD:-development-only}@postgres:5432/${VIDEO_POSTGRES_DB:-video_factory}
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:3001
      VIDEO_MANIFEST_SCHEMA_PATH: /workspace/packages/contracts/video-manifest.schema.json
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-video-factory-dev}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-video-factory-dev-only-change-me}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      PROVIDER_EXTERNAL_EXECUTION_ENABLED: "false"
      PROVIDER_PAID_EXECUTION_ENABLED: "false"
      PROVIDER_GLOBAL_KILL_SWITCH_ENGAGED: "true"
      PROVIDER_BUDGET_CURRENCY: VND
      PROVIDER_PER_OPERATION_LIMIT_VND: "0"
      PROVIDER_DAILY_LIMIT_VND: "0"
      PROVIDER_HTTP_TIMEOUT_SECONDS: "90"
      CONTROLLER_HARD_TIMEOUT_SECONDS: "120"
      PROVIDER_MAX_CONCURRENT_CALLS: "2"
      PROVIDER_OPERATION_LEASE_SECONDS: "900"
      PROVIDER_OPERATION_RETENTION_DAYS: "400"
      PROVIDER_RETENTION_CLEANUP_ENABLED: "false"
      MEDIA_MALWARE_SCANNER_MODE: fixture
      OPENAI_API_KEY: ""
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
      - ${VIDEO_FACTORY_AGENT_HUB_KEYS_FILE:-./deploy/testing/disabled-agent-hub.json}:/run/secrets/video-factory-agent-hub.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      renderer:
        condition: service_started

  renderer:
    build:
      context: ./renderer
    env_file: .env
    environment:
      OPENAI_API_KEY: ""
    ports:
      - "${VIDEO_RENDERER_BIND:-127.0.0.1}:${VIDEO_RENDERER_PORT:-3001}:3001"
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    shm_size: "2gb"

  # Optional owner-gated bridge. It does not start in the default stack and it
  # does not bundle ComfyUI, GPU models or arbitrary user-supplied graphs.
  comfyui-bridge:
    profiles: ["gpu"]
    build:
      context: ./services/comfyui-bridge
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      COMFYUI_WORKFLOW_MANIFEST: /workspace/workflows/comfyui/manifest.json
      COMFYUI_EXECUTION_ENABLED: ${COMFYUI_EXECUTION_ENABLED:-false}
      COMFYUI_BACKEND: ${COMFYUI_BACKEND:-disabled}
    volumes:
      - ./workflows/comfyui:/workspace/workflows/comfyui:ro
    expose:
      - "8011"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8011/healthz\", timeout=2)'" ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
