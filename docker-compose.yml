name: npd-video-factory-v2

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:3001
    ports:
      - "${VIDEO_API_BIND:-127.0.0.1}:${VIDEO_API_PORT:-8000}:8000"
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:3001
      VIDEO_MANIFEST_SCHEMA_PATH: /workspace/packages/contracts/video-manifest.schema.json
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    depends_on:
      redis:
        condition: service_healthy
      renderer:
        condition: service_started

  renderer:
    build:
      context: ./renderer
    env_file: .env
    ports:
      - "${VIDEO_RENDERER_BIND:-127.0.0.1}:${VIDEO_RENDERER_PORT:-3001}:3001"
    volumes:
      - ./storage:/workspace/storage
      - ./packages/contracts:/workspace/packages/contracts:ro
    shm_size: "2gb"

volumes:
  redis-data:
