server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx:alpine does not map ES module files by default. Combined with
    # X-Content-Type-Options: nosniff, an octet-stream response prevents the
    # Studio application from booting in the browser.
    location ~ \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
